spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:oracle:thin:@172.26.4.137:1521/XEPDB1?oracle.net.ENCODING=UTF8&oracle.net.legacyFormat=false
    username: system
    password: '123456789.'
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

file:
  storage:
    root-path: C:/rvd/uploads


# SpringDoc OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# JWT SecurityAuth: RVD solo entra desde Vortal (sin login local).
# - jwk-set-uri / issuer: deben coincidir con el AS.
# - application-id: 90001 (RVD Nuevo en Vortal).
# - base-url: para resolver permisos METHOD:URL por rol.
# - enforce-funcionalidad: false = endpoints sin catálogo pasan si hay JWT válido;
#   true = solo METHOD:URL autorizados (403 si falta permiso).
rvd:
  security:
    security-auth:
      jwk-set-uri: http://127.0.0.1:8171/oauth2/jwks
      issuer: http://127.0.0.1:8171
      base-url: http://127.0.0.1:8171
      application-id: 90001 #### NO ES EL ID REAL.
      enforce-funcionalidad: false
      public-key-pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8OnsFsaFEury5ZBTumIS
        nhU8ZqtbkRRMuh2tAj7nU/gZWgnRXLzkm/Ftg0lOpT37CXqfrRPPR0kXXcIDvNZp
        6XjTrQE1PPIyPqDKH03hYofRSWhSakuXk9qu11QzkGYO00EDjWCFC/JzhZimZnZK
        aw65CmTAnnpml76Mbe6nfAXN1xlQDhHaC6n5zEyz1xtHr0I1XoA4t63BDJD6vxHu
        1Y2WWkVdJkmtWxDmSiCTLh6e+VjL2oNJWR4FuZk8fsju0i4x7+dsaL+eQ/G2D8Gn
        a8WtLakyNgLl3TZfZQJHYfimo0k/xEC3Bw87IJSgGxIdC6xW3FZuu9lSmg9mZ0zH
        LQIDAQAB
        -----END PUBLIC KEY-----

server:
  servlet:
    context-path: /rvd

logging:
  level:
    root: INFO
    co.edu.unipamplona.ciadti.rvd: DEBUG
  file:
    path: C:/rvd/logs #TODO: Cambiar a la ruta de logs !!!!!!
  size-alert:
    threshold-bytes: 1073741824 # 1 GB
    check-ms: 3600000 # cada 1 hora
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"